
<!DOCTYPE html>
<html lang="en">

<head>

    <title>Education | Portfolio</title>

    <link rel="stylesheet" href="./education.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- AOS Animation -->
    <link rel="stylesheet"
        href="https://unpkg.com/aos@2.3.1/dist/aos.css">

</head>

<body>

    <div class="background" id="home">

        <div class="color">

            <!-- NAVBAR -->

            <div class="navbar">

                <div class="anime">
                    <img src="./asserts/logo.jpg" alt="Logo">
                </div>

                <div class="anime_para">

                    <p><a href="./index.html">HOME</a></p>

                    <p><a href="./about_us.html">ABOUT ME</a></p>

                    <p><a href="./education.html">EDUCATION</a></p>

                    <p><a href="./skills.html">SKILLS</a></p>

                    <p><a href="./project.html">PROJECT</a></p>

                    <p><a href="./contact.html">CONTACT</a></p>

                    <span>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>

                </div>

            </div>


            <!-- EDUCATION SECTION -->

            <section class="education">

                <div class="education_title" data-aos="fade-up">

                    <p class="edu_title">EDUCATION</p>

                </div>


                <div class="studies">


                    <!-- SCHOOL CARD -->

                    <div class="education_grid" data-aos="fade-up">

                        <div class="school_image">

                            <div class="school_content">

                                <span class="school_icons">
                                    <i class="fa-solid fa-school"></i>
                                </span>

                                <div class="school_para">

                                    <p class="sec">SCHOOL</p>

                                    <p class="sec_name">[HSc]</p>

                                    <p class="sec_year">2021</p>

                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- COLLEGE CARD -->

                    <div class="education_grid" data-aos="fade-up" data-aos-delay="200">

                        <div class="college_image">

                            <div class="school_content">

                                <span class="school_icons">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </span>

                                <div class="school_para">

                                    <p class="sec">COLLEGE</p>

                                    <p class="sec_name">Holy Cross College</p>

                                    <p class="sec_year">2022-2025</p>

                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- COURSE CARD -->

                    <div class="education_grid" data-aos="fade-up" data-aos-delay="400">

                        <div class="alo_image">

                            <div class="school_content">

                                <span class="school_icons">
                                    <i class="bi bi-laptop"></i>
                                </span>

                                <div class="school_para">

                                    <p class="sec">COURSE</p>

                                    <p class="sec_name">Full Stack</p>

                                    <p class="sec_year">Sep-2025-Apr-2026</p>

                                </div>

                            </div>

                        </div>

                    </div>


                </div>

            </section>


        </div>

    </div>


    <!-- AOS SCRIPT -->

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

</html>
